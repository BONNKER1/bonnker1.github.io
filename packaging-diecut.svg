<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="620" viewBox="0 0 520 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="520" height="620" fill="#f5f5f3"/>
  <g transform="translate(40,40)">
    <!-- Крышка (верх) -->
    <rect x="75" y="0" width="165" height="215" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="157.5" y="108" text-anchor="middle" font-size="9" fill="#888">КРЫШКА 33×43</text>
    <!-- Задняя стенка -->
    <rect x="75" y="215" width="165" height="25" fill="#f0f0ee" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Дно -->
    <rect x="75" y="240" width="165" height="215" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="157.5" y="348" text-anchor="middle" font-size="9" fill="#888">ДНО 33×43</text>
    <!-- Передняя стенка -->
    <rect x="75" y="455" width="165" height="25" fill="#f0f0ee" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Левая стенка -->
    <rect x="50" y="240" width="25" height="215" fill="#f0f0ee" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Правая стенка -->
    <rect x="240" y="240" width="25" height="215" fill="#f0f0ee" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Клапаны левой стенки -->
    <polygon points="50,240 25,265 25,430 50,455" fill="#e8e8e6" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Клапаны правой стенки -->
    <polygon points="265,240 290,265 290,430 265,455" fill="#e8e8e6" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Клапан крышки (передний) -->
    <rect x="75" y="-25" width="165" height="25" fill="#e8e8e6" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Линии сгиба (пунктир) -->
    <g stroke="#999" stroke-width="1" stroke-dasharray="4,3" fill="none">
      <line x1="75" y1="215" x2="240" y2="215"/>
      <line x1="75" y1="240" x2="240" y2="240"/>
      <line x1="75" y1="455" x2="240" y2="455"/>
      <line x1="50" y1="240" x2="50" y2="455"/>
      <line x1="265" y1="240" x2="265" y2="455"/>
      <line x1="75" y1="0" x2="75" y2="25" />
    </g>
    <!-- Подписи размеров -->
    <text x="157.5" y="232" text-anchor="middle" font-size="8" fill="#555">сгиб 5 см</text>
    <text x="157.5" y="472" text-anchor="middle" font-size="8" fill="#555">сгиб 5 см</text>
    <text x="38" y="348" text-anchor="middle" font-size="8" fill="#555" transform="rotate(-90 38 348)">стенка 5 см</text>
    <text x="278" y="348" text-anchor="middle" font-size="8" fill="#555" transform="rotate(90 278 348)">стенка 5 см</text>
  </g>
  <text x="260" y="600" text-anchor="middle" font-size="10" fill="#666">Развёртка коробки-крышка-дно · масштаб 1:5 (1 см = 5 px) · сплошная линия — рез, пунктир — сгиб</text>
</svg>