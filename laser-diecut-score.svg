<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <!-- ===== ЧАСТЬ A: КРЫШКА (левая) ===== -->
  <!-- Боковой клапан крышки (левый) -->
  <rect x="10" y="60" width="50" height="430" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Крышка -->
  <rect x="60" y="60" width="330" height="430" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Боковой клапан крышки (правый) -->
  <rect x="390" y="60" width="50" height="430" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Передний клапан крышки -->
  <rect x="60" y="10" width="330" height="50" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Задняя стенка (крышка) -->
  <rect x="60" y="490" width="330" height="50" fill="none" stroke="#000000" stroke-width="0.5"/>

  <!-- Линии сгиба (микро-надрез) — красный -->
  <g stroke="#ff0000" stroke-width="0.3" fill="none">
    <!-- крышка <-> передний клапан -->
    <line x1="60" y1="60" x2="390" y2="60"/>
    <!-- крышка <-> задняя стенка -->
    <line x1="60" y1="490" x2="390" y2="490"/>
    <!-- крышка <-> левый боковой клапан -->
    <line x1="60" y1="60" x2="60" y2="490"/>
    <!-- крышка <-> правый боковой клапан -->
    <line x1="390" y1="60" x2="390" y2="490"/>
  </g>

  <!-- ===== ЧАСТЬ B: ДНО (правая) ===== -->
  <!-- Задняя стенка (дно) -->
  <rect x="500" y="10" width="330" height="50" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Боковая стенка (левая) -->
  <rect x="450" y="60" width="50" height="430" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Дно -->
  <rect x="500" y="60" width="330" height="430" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Боковая стенка (правая) -->
  <rect x="830" y="60" width="50" height="430" fill="none" stroke="#000000" stroke-width="0.5"/>
  <!-- Передняя стенка (дно) -->
  <rect x="500" y="490" width="330" height="50" fill="none" stroke="#000000" stroke-width="0.5"/>

  <!-- Линии сгиба (микро-надрез) — красный -->
  <g stroke="#ff0000" stroke-width="0.3" fill="none">
    <!-- дно <-> задняя стенка -->
    <line x1="500" y1="60" x2="830" y2="60"/>
    <!-- дно <-> передняя стенка -->
    <line x1="500" y1="490" x2="830" y2="490"/>
    <!-- дно <-> левая боковая стенка -->
    <line x1="500" y1="60" x2="500" y2="490"/>
    <!-- дно <-> правая боковая стенка -->
    <line x1="830" y1="60" x2="830" y2="490"/>
  </g>
</svg>