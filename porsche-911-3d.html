<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Porsche 911 — 3D модель</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111418; color: #e8eaed; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    #info { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,.45); padding: 10px 14px; border-radius: 10px; backdrop-filter: blur(6px); font-size: 14px; line-height: 1.4; }
    #info b { font-size: 16px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info"><b>Porsche 911 (стилизованная 3D-модель)</b><br>ЛКМ/зажать — вращение · колёсико — зум · ПКМ — сдвиг</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111418);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(6.5, 3.2, 7.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.55, 0);
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemi = new THREE.HemisphereLight(0xffffff, 0x223344, 0.6);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.8);
    dir.position.set(5, 8, 4);
    dir.castShadow = true;
    dir.shadow.mapSize.set(2048, 2048);
    dir.shadow.camera.near = 1; dir.shadow.camera.far = 30;
    dir.shadow.camera.left = -8; dir.shadow.camera.right = 8;
    dir.shadow.camera.top = 8; dir.shadow.camera.bottom = -8;
    scene.add(dir);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(20, 64),
      new THREE.MeshStandardMaterial({ color: 0x1a1f26, roughness: 0.95, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(30, 30, 0x2a313c, 0x1f252e);
    grid.position.y = 0.001;
    scene.add(grid);

    const car = new THREE.Group();
    scene.add(car);

    const paint = new THREE.MeshPhysicalMaterial({
      color: 0xd6d1c4, // classic chalk-like silver
      metalness: 0.9,
      roughness: 0.18,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06
    });
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0x88aabb, metalness: 0, roughness: 0.05, transmission: 0.85, thickness: 0.2, transparent: true, opacity: 0.6
    });
    const black = new THREE.MeshStandardMaterial({ color: 0x0f1114, roughness: 0.6, metalness: 0.2 });
    const chrome = new THREE.MeshStandardMaterial({ color: 0xe8eef5, roughness: 0.15, metalness: 1.0 });
    const red = new THREE.MeshStandardMaterial({ color: 0xb01018, roughness: 0.4, metalness: 0.1, emissive: 0x330004 });
    const whiteLight = new THREE.MeshStandardMaterial({ color: 0xf7f7ff, roughness: 0.2, metalness: 0.1, emissive: 0x666666 });

    function add(mesh, x=0,y=0,z=0, rx=0,ry=0,rz=0) {
      mesh.position.set(x,y,z);
      mesh.rotation.set(rx,ry,rz);
      mesh.castShadow = true; mesh.receiveShadow = true;
      car.add(mesh);
      return mesh;
    }

    // Main body (lower)
    const body = add(new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.55, 1.82), paint), 0, 0.55, 0);
    // Upper cabin base
    const cabinBase = add(new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.38, 1.62), paint), -0.15, 0.95, 0);
    // Hood (front, sloping)
    const hood = add(new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.18, 1.72), paint), 1.55, 0.72, 0, 0, 0, -0.18);
    // Rear engine deck (iconic 911 slope down to back)
    const rearDeck = add(new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.16, 1.72), paint), -1.55, 0.78, 0, 0, 0, 0.28);
    // Rear end taper
    const rear = add(new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.42, 1.74), paint), -1.95, 0.5, 0);

    // Roof / greenhouse
    const roof = add(new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.12, 1.5), paint), -0.35, 1.22, 0, 0, 0, 0.02);
    // Windshield frame
    const windshield = add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.55, 1.45), glassMat), 0.55, 1.05, 0, 0, 0, -0.55);
    // Rear window
    const rearGlass = add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.42, 1.4), glassMat), -1.05, 1.02, 0, 0, 0, 0.7);
    // Side windows (left/right)
    const sideL = add(new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.4, 0.06), glassMat), -0.2, 1.02, 0.78, 0, 0, 0);
    const sideR = sideL.clone(); sideR.position.z = -0.78; car.add(sideR);

    // Fenders (widened hips typical for 911)
    const fGeo = new THREE.BoxGeometry(0.95, 0.32, 0.28);
    [[1.25,0.48,0.92],[1.25,0.48,-0.92],[-1.35,0.5,0.95],[-1.35,0.5,-0.95]].forEach(p=>{
      add(new THREE.Mesh(fGeo, paint), ...p);
    });

    // Bumpers
    add(new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.22, 1.78), black), 2.18, 0.38, 0);
    add(new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.24, 1.8), black), -2.16, 0.4, 0);

    // Headlights (round-ish signature simplified)
    function headlight(x, z) {
      const g = new THREE.Group();
      const housing = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.08, 24), chrome);
      housing.rotation.z = Math.PI/2;
      const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.09, 24), whiteLight);
      lens.rotation.z = Math.PI/2; lens.position.x = 0.01;
      g.add(housing, lens); g.position.set(x, 0.62, z); g.castShadow = true; car.add(g);
    }
    headlight(2.06, 0.55); headlight(2.06, -0.55);

    // Taillight bar
    const tail = add(new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 1.55), red), -2.23, 0.62, 0);
    const tailGlow = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.04, 1.35), new THREE.MeshStandardMaterial({color:0xff2020, emissive:0xaa0000, emissiveIntensity:0.8}));
    tailGlow.position.set(-2.24,0.62,0); car.add(tailGlow);

    // Wheels
    function wheel(x, z) {
      const g = new THREE.Group();
      const tire = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.14, 16, 32), new THREE.MeshStandardMaterial({color:0x151515, roughness:0.9, metalness:0.05}));
      tire.rotation.y = Math.PI/2;
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.18, 24), chrome);
      rim.rotation.z = Math.PI/2;
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.2, 16), black);
      cap.rotation.z = Math.PI/2;
      // spokes
      for (let i=0;i<5;i++){
        const s = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.22, 0.06), new THREE.MeshStandardMaterial({color:0xcfd6de, metalness:0.9, roughness:0.2}));
        s.rotation.x = (i/5)*Math.PI*2;
        s.position.y = Math.sin(s.rotation.x)*0.12;
        s.position.z = Math.cos(s.rotation.x)*0.12;
        g.add(s);
      }
      g.add(tire, rim, cap);
      g.position.set(x, 0.38, z);
      g.traverse(o=>{o.castShadow=true;});
      car.add(g);
      return g;
    }
    const wheels = [wheel(1.35, 0.95), wheel(1.35, -0.95), wheel(-1.35, 0.98), wheel(-1.35, -0.98)];

    // Mirrors
    function mirror(z) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.08, 0.12), paint);
      m.position.set(0.45, 0.98, z);
      car.add(m);
    }
    mirror(0.86); mirror(-0.86);

    // Subtle ground shadow plane
    const shadow = new THREE.Mesh(
      new THREE.PlaneGeometry(5.2, 2.6),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })
    );
    shadow.rotation.x = -Math.PI/2; shadow.position.y = 0.01; car.add(shadow);

    // Center car
    car.position.y = 0;

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', onResize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
