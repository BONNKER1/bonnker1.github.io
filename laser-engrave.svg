<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="330" height="430" viewBox="0 0 330 430" font-family="Helvetica, Arial, sans-serif">
  <!-- Рамка -->
  <rect x="8" y="8" width="314" height="414" fill="none" stroke="#000000" stroke-width="0.6"/>
  <!-- Заголовок -->
  <text x="165" y="70" text-anchor="middle" font-size="26" font-weight="300" fill="#000000" letter-spacing="4">CANVAS</text>
  <text x="165" y="95" text-anchor="middle" font-size="14" fill="#000000">30 × 40 cm</text>
  <line x1="95" y1="110" x2="235" y2="110" stroke="#000000" stroke-width="0.4"/>
  <!-- Подзаголовок -->
  <text x="165" y="135" text-anchor="middle" font-size="9" fill="#000000" letter-spacing="2">HANDLE WITH CARE</text>
  <!-- Иконка: хрупкое (треугольник с !) -->
  <g transform="translate(60,300)">
    <polygon points="25,0 50,43 0,43" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="25" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">!</text>
    <text x="25" y="58" text-anchor="middle" font-size="8" fill="#000000">FRAGILE</text>
  </g>
  <!-- Иконка: не сгибать (перечёркнутый сгиб) -->
  <g transform="translate(140,300)">
    <rect x="0" y="8" width="50" height="30" fill="none" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="8" x2="50" y2="38" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="38" x2="50" y2="8" stroke="#000000" stroke-width="1"/>
    <text x="25" y="58" text-anchor="middle" font-size="8" fill="#000000">DO NOT BEND</text>
  </g>
  <!-- Иконка: беречь от влаги (капля) -->
  <g transform="translate(220,300)">
    <path d="M25,0 Q40,20 40,32 Q40,45 25,45 Q10,45 10,32 Q10,20 25,0 Z" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="25" y="58" text-anchor="middle" font-size="8" fill="#000000">KEEP DRY</text>
  </g>
  <!-- Штрихкод-плейсхолдер -->
  <g transform="translate(115,375)">
    <rect x="0" y="0" width="100" height="30" fill="none" stroke="#000000" stroke-width="0.6"/>
    <!-- Вертикальные линии (имитация штрихкода) -->
    <line x1="5" y1="4" x2="5" y2="26" stroke="#000000" stroke-width="1.2"/>
    <line x1="9" y1="4" x2="9" y2="26" stroke="#000000" stroke-width="0.6"/>
    <line x1="13" y1="4" x2="13" y2="26" stroke="#000000" stroke-width="1.4"/>
    <line x1="18" y1="4" x2="18" y2="26" stroke="#000000" stroke-width="0.8"/>
    <line x1="22" y1="4" x2="22" y2="26" stroke="#000000" stroke-width="1.0"/>
    <line x1="27" y1="4" x2="27" y2="26" stroke="#000000" stroke-width="1.6"/>
    <line x1="32" y1="4" x2="32" y2="26" stroke="#000000" stroke-width="0.6"/>
    <line x1="36" y1="4" x2="36" y2="26" stroke="#000000" stroke-width="1.2"/>
    <line x1="41" y1="4" x2="41" y2="26" stroke="#000000" stroke-width="0.8"/>
    <line x1="45" y1="4" x2="45" y2="26" stroke="#000000" stroke-width="1.4"/>
    <line x1="50" y1="4" x2="50" y2="26" stroke="#000000" stroke-width="0.6"/>
    <line x1="54" y1="4" x2="54" y2="26" stroke="#000000" stroke-width="1.0"/>
    <line x1="59" y1="4" x2="59" y2="26" stroke="#000000" stroke-width="1.6"/>
    <line x1="64" y1="4" x2="64" y2="26" stroke="#000000" stroke-width="0.8"/>
    <line x1="68" y1="4" x2="68" y2="26" stroke="#000000" stroke-width="1.2"/>
    <line x1="73" y1="4" x2="73" y2="26" stroke="#000000" stroke-width="0.6"/>
    <line x1="77" y1="4" x2="77" y2="26" stroke="#000000" stroke-width="1.4"/>
    <line x1="82" y1="4" x2="82" y2="26" stroke="#000000" stroke-width="0.8"/>
    <line x1="86" y1="4" x2="86" y2="26" stroke="#000000" stroke-width="1.0"/>
    <line x1="91" y1="4" x2="91" y2="26" stroke="#000000" stroke-width="1.6"/>
    <line x1="95" y1="4" x2="95" y2="26" stroke="#000000" stroke-width="0.6"/>
    <text x="50" y="42" text-anchor="middle" font-size="7" fill="#000000">EAN-13 (заменить на реальный)</text>
  </g>
  <text x="165" y="420" text-anchor="middle" font-size="7" fill="#888">Гравировка на крышке · 330×430 мм · минималистичный дизайн</text>
</svg>