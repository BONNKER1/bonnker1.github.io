<svg width="400mm" height="300mm" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- ВНЕШНИЙ КОНТУР -->
  <rect x="0" y="0" width="400" height="300" fill="none" stroke="red" stroke-width="0.5"/>
  
  <!-- КАНАЛЫ ПОД ТРЕЩОТКИ (ЛЕВО) -->
  <rect x="20" y="20" width="30" height="150" fill="none" stroke="black" stroke-width="0.5"/>
  <rect x="60" y="20" width="25" height="150" fill="none" stroke="black" stroke-width="0.5"/>
  
  <!-- СЕТКА ПОД ГОЛОВКИ (ПРАВО) -->
  <circle cx="150" cy="40" r="12" fill="none" stroke="black" stroke-width="0.5"/>
  <circle cx="190" cy="40" r="12" fill="none" stroke="black" stroke-width="0.5"/>
  <circle cx="230" cy="40" r="12" fill="none" stroke="black" stroke-width="0.5"/>
  <circle cx="270" cy="40" r="12" fill="none" stroke="black" stroke-width="0.5"/>
  
  <circle cx="150" cy="80" r="10" fill="none" stroke="black" stroke-width="0.5"/>
  <circle cx="190" cy="80" r="10" fill="none" stroke="black" stroke-width="0.5"/>
  <circle cx="230" cy="80" r="10" fill="none" stroke="black" stroke-width="0.5"/>
  <circle cx="270" cy="80" r="10" fill="none" stroke="black" stroke-width="0.5"/>

  <!-- СЕКЦИЯ ПОД РОЖКОВЫЕ КЛЮЧИ (НИЗ, ПОД УГЛОМ) -->
  <rect x="20" y="200" width="120" height="15" fill="none" stroke="black" stroke-width="0.5" transform="rotate(-10 20 200)"/>
  <rect x="20" y="230" width="130" height="15" fill="none" stroke="black" stroke-width="0.5" transform="rotate(-10 20 230)"/>
  <rect x="20" y="260" width="140" height="15" fill="none" stroke="black" stroke-width="0.5" transform="rotate(-10 20 260)"/>
</svg>
