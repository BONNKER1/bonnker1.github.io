<svg width="400mm" height="300mm" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- ВНЕШНИЙ КОНТУР -->
  <rect x="0" y="0" width="400" height="300" fill="none" stroke="red" stroke-width="1.5"/>
  
  <!-- 1. ЗУБИЛО (Силуэт) -->
  <path d="M 20 20 l 20 0 l 10 150 l -40 0 Z" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="30" y="180" font-family="Arial" font-size="10" fill="black" text-anchor="middle">ЗУБИЛО</text>

  <!-- 2. РОЖКОВЫЕ КЛЮЧИ (Силуэты под углом) -->
  <!-- Ключ 1 -->
  <path d="M 60 20 l 160 20 l 5 10 l -160 20 l -5 -10 Z" fill="none" stroke="black" stroke-width="0.5"/>
  <!-- Ключ 2 -->
  <path d="M 60 60 l 150 20 l 5 10 l -150 20 l -5 -10 Z" fill="none" stroke="black" stroke-width="0.5"/>
  <!-- Ключ 3 -->
  <path d="M 60 100 l 140 20 l 5 10 l -140 20 l -5 -10 Z" fill="none" stroke="black" stroke-width="0.5"/>
  <!-- Ключ 4 -->
  <path d="M 60 140 l 130 20 l 5 10 l -130 20 l -5 -10 Z" fill="none" stroke="black" stroke-width="0.5"/>

  <!-- 3. СЕТКА ГОЛОВОК (Плотная, 6x4) -->
  <g transform="translate(20, 200)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="30" cy="0" r="10" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="60" cy="0" r="10" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="90" cy="0" r="10" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="120" cy="0" r="10" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="150" cy="0" r="10" fill="none" stroke="black" stroke-width="0.5"/>
    
    <circle cx="0" cy="30" r="9" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="30" cy="30" r="9" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="60" cy="30" r="9" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="90" cy="30" r="9" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="120" cy="30" r="9" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="150" cy="30" r="9" fill="none" stroke="black" stroke-width="0.5"/>
    
    <circle cx="0" cy="60" r="8" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="30" cy="60" r="8" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="60" cy="60" r="8" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="90" cy="60" r="8" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="120" cy="60" r="8" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="150" cy="60" r="8" fill="none" stroke="black" stroke-width="0.5"/>
  </g>

  <!-- 4. ТРЕЩОТКА 1/2 -->
  <rect x="250" y="20" width="20" height="100" fill="none" stroke="black" stroke-width="0.5"/>

  <!-- 5. УДЛИНИТЕЛЬ 125 -->
  <rect x="290" y="20" width="15" height="100" fill="none" stroke="black" stroke-width="0.5"/>

  <!-- 6. КАРДАН 1/2 -->
  <rect x="325" y="20" width="40" height="15" fill="none" stroke="black" stroke-width="0.5"/>

  <!-- 7. ЗАГОЛОВОК -->
  <text x="200" y="15" font-family="Arial" font-size="14" fill="black" text-anchor="middle">ЛОЖЕМЕНТ 1/2" DRIVE</text>

</svg>
