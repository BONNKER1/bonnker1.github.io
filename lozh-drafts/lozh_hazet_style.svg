<svg width="400mm" height="300mm" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cut { fill: none; stroke: #000000; stroke-width: 0.5; stroke-linecap: round; }
      .border { fill: none; stroke: #ff0000; stroke-width: 0.8; }
      .text { fill: #000000; font-family: 'Arial'; font-size: 8px; }
    </style>
  </defs>

  <!-- ВНЕШНИЙ КОНТУР -->
  <rect class="border" x="0" y="0" width="400" height="300" rx="2"/>

  <!-- ЛЕВАЯ СЕКЦИЯ: Инструменты (каналы) -->
  <!-- Канал трещотки + поперечный бар для пальцев -->
  <rect class="cut" x="30" y="20" width="30" height="250" rx="5"/>
  <rect class="cut" x="25" y="150" width="40" height="15" fill="#ffffff"/> <!-- поперечный бар -->
  
  <!-- Канал удлинителя -->
  <rect class="cut" x="70" y="20" width="20" height="200" rx="3"/>
  <rect class="cut" x="65" y="100" width="30" height="15" fill="#ffffff"/>

  <!-- ПРАВАЯ СЕКЦИЯ: Сетка головок -->
  <!-- Генерация сетки (упрощенно) -->
  <g transform="translate(120, 20)">
    <circle class="cut" cx="0" cy="0" r="14"/>
    <circle class="cut" cx="35" cy="0" r="14"/>
    <circle class="cut" cx="70" cy="0" r="14"/>
    
    <circle class="cut" cx="0" cy="40" r="12"/>
    <circle class="cut" cx="35" cy="40" r="12"/>
    <circle class="cut" cx="70" cy="40" r="12"/>

    <circle class="cut" cx="0" cy="80" r="10"/>
    <circle class="cut" cx="35" cy="80" r="10"/>
    <circle class="cut" cx="70" cy="80" r="10"/>
    
    <circle class="cut" cx="0" cy="120" r="9"/>
    <circle class="cut" cx="35" cy="120" r="9"/>
    <circle class="cut" cx="70" cy="120" r="9"/>
  </g>

  <!-- МАРКИРОВКА -->
  <text class="text" x="45" y="280">1/2" RATCHET</text>
  <text class="text" x="150" y="170">SOCKETS 10-24mm</text>

</svg>
