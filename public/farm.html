<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Boonker Bio-System Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap');
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        .glass { background: #111; border: 1px solid #222; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .module { padding: 20px; border-radius: 12px; background: #1a1a1a; transition: 0.3s; cursor: pointer; text-align: center; border: 1px solid #333; }
        .module:hover { border: 1px solid #82c91e; box-shadow: 0 0 15px rgba(130, 201, 30, 0.2); }
        .icon { font-size: 40px; display: block; margin-bottom: 10px; }
        .btn-up { margin-top: 10px; background: #82c91e; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1 style="color: #82c91e;">BOONKER • LIVE FARM</h1>
    <div id="app"></div>

    <script>
        const state = {
            sol: 1000,
            units: [
                { id: 'cow', name: 'Корова', icon: '🐄', lvl: 1, val: 0, sell: 100 },
                { id: 'sheep', name: 'Баран', icon: '🐏', lvl: 1, val: 0, sell: 80 },
                { id: 'chicken', name: 'Курица', icon: '🐓', lvl: 1, val: 0, sell: 30 },
                { id: 'quail', name: 'Перепелка', icon: '🐦', lvl: 1, val: 0, sell: 40 },
                { id: 'goose', name: 'Гусь', icon: '🦢', lvl: 1, val: 0, sell: 60 }
            ]
        };

        function render() {
            document.getElementById('app').innerHTML = `
                <div class="glass"><h2>Баланс: ${Math.floor(state.sol)} SOL</h2></div>
                <div class="grid">
                    ${state.units.map((u, i) => `
                        <div class="module" onclick="collect(${i})">
                            <div class="icon">${u.icon}</div>
                            <h3>${u.name} (Lvl ${u.lvl})</h3>
                            <p>Продукт: ${Math.floor(u.val)}</p>
                            <button class="btn-up" onclick="event.stopPropagation(); upgrade(${i})">Улучшить</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function collect(i) {
            state.sol += state.units[i].val * state.units[i].sell;
            state.units[i].val = 0;
            render();
        }

        function upgrade(i) {
            const cost = 200 * state.units[i].lvl;
            if (state.sol >= cost) {
                state.sol -= cost;
                state.units[i].lvl++;
                render();
            }
        }

        setInterval(() => {
            state.units.forEach(u => u.val += (0.05 * u.lvl));
            render();
        }, 1000);
        
        render();
    </script>
</body>
</html>
