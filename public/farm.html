<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Boonker Farm — Command Center</title>
    <style>
        :root { --bg: #0a0a0a; --green: #00ff41; --panel: #111; }
        body { background: var(--bg); color: var(--green); font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .dashboard { max-width: 800px; margin: auto; border: 1px solid var(--green); padding: 20px; border-radius: 10px; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .garden-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .plot { height: 100px; border: 1px dashed #333; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .plot:hover { border-color: var(--green); background: #002200; }
        .shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .btn { padding: 10px; background: transparent; border: 1px solid var(--green); color: var(--green); cursor: pointer; }
        .btn:hover { background: var(--green); color: #000; }
        .drop { position: absolute; color: #3498db; pointer-events: none; animation: fall 1s linear forwards; }
        @keyframes fall { 0% { transform: translateY(-50px); opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <span>FARM_OS v1.0</span>
        <span>BALANCE: <span id="balance">50</span> Sol</span>
    </div>

    <div class="garden-grid" id="garden"></div>

    <h3>Магазин семян</h3>
    <div class="shop" id="shop"></div>
</div>

<script>
    let state = { balance: 50, plots: [null, null, null, null, null, null, null, null] };
    const seeds = [
        { name: "Базилик", price: 10, icon: "🌿", sell: 20 },
        { name: "Томат", price: 25, icon: "🍅", sell: 50 },
        { name: "Роза", price: 50, icon: "🌹", sell: 120 }
    ];

    function render() {
        const garden = document.getElementById('garden');
        garden.innerHTML = state.plots.map((p, i) => `
            <div class="plot" onclick="harvest(${i})">
                ${p ? `<div style="font-size:30px">${p.icon}</div><div>${p.name}</div>` : 'Empty'}
            </div>
        `).join('');
        document.getElementById('balance').innerText = state.balance;

        const shop = document.getElementById('shop');
        shop.innerHTML = seeds.map(s => `
            <button class="btn" onclick="buy('${s.name}')">${s.icon} ${s.name} (${s.price} Sol)</button>
        `).join('');
    }

    function buy(name) {
        const s = seeds.find(x => x.name === name);
        if (state.balance >= s.price) {
            const emptyIdx = state.plots.findIndex(x => x === null);
            if (emptyIdx !== -1) {
                state.balance -= s.price;
                state.plots[emptyIdx] = { ...s, planted: Date.now() };
                render();
            } else alert("Нет свободных грядок!");
        } else alert("Мало Sol!");
    }

    function harvest(i) {
        if (state.plots[i]) {
            state.balance += state.plots[i].sell;
            state.plots[i] = null;
            render();
            startDrops();
        }
    }

    function startDrops() {
        for(let i=0; i<15; i++) {
            const d = document.createElement('div');
            d.className = 'drop';
            d.innerText = '💧';
            d.style.left = Math.random() * 100 + 'vw';
            document.body.appendChild(d);
            setTimeout(() => d.remove(), 1000);
        }
    }

    render();
</script>
</body>
</html>
