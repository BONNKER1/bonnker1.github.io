<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Boonker Bio-System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap');
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        .glass { background: #111; border: 1px solid #222; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .module { padding: 20px; border-radius: 12px; background: #1a1a1a; transition: 0.3s; cursor: pointer; text-align: center; border: 1px solid #333; }
        .module:hover { border: 1px solid #82c91e; box-shadow: 0 0 15px rgba(130, 201, 30, 0.2); }
        .anim { animation: pulse 2s infinite; display: inline-block; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .btn-up { margin-top: 10px; background: #82c91e; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1 style="color: #82c91e;">BOONKER • BIO-SYSTEM</h1>
    <div id="app"></div>

    <script>
        const state = {
            modules: {
                agro: { name: 'Растения', lvl: 1, val: 0, icon: '🌿' },
                api: { name: 'Пасека', lvl: 1, val: 0, icon: '🐝' },
                aqua: { name: 'Бассейн', lvl: 1, val: 0, icon: '🐟' }
            }
        };

        function render() {
            document.getElementById('app').innerHTML = `
                <div class="grid">
                    ${Object.entries(state.modules).map(([id, m]) => `
                        <div class="module" onclick="collect('${id}')">
                            <div class="anim" style="font-size: 50px">${m.icon}</div>
                            <h3>${m.name} (Lvl ${m.lvl})</h3>
                            <p>Ресурс: ${Math.floor(m.val)}</p>
                            <button class="btn-up" onclick="event.stopPropagation(); upgrade('${id}')">Улучшить</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function collect(id) {
            state.modules[id].val = 0;
            // Звуковой эффект нажатия
            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-click-melodic-tone-1129.mp3');
            audio.play().catch(() => {});
            render();
        }

        function upgrade(id) {
            state.modules[id].lvl++;
            render();
        }

        setInterval(() => {
            Object.values(state.modules).forEach(m => m.val += (0.1 * m.lvl));
            render();
        }, 1000);
        
        render();
    </script>
</body>
</html>
