<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Boonker Bio-System Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap');
        body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        
        /* Navigation */
        .nav { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .nav-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        .nav-btn.active { color: #82c91e; }

        /* Dashboard Sections */
        .section { display: none; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .section.active { display: grid; }
        
        .mod-card { background: #0f0f0f; border: 1px solid #222; padding: 25px; border-radius: 20px; text-align: center; transition: 0.3s; }
        .mod-card:hover { border-color: #82c91e; box-shadow: 0 0 20px rgba(130, 201, 30, 0.1); }
        .icon { font-size: 60px; display: block; margin-bottom: 15px; }
        
        .btn-act { width: 100%; background: transparent; border: 1px solid #82c91e; color: #82c91e; padding: 12px; border-radius: 10px; cursor: pointer; margin-top: 15px; }
        .btn-act:hover { background: #82c91e; color: #000; }
        
        .badge { background: #1a1a1a; padding: 4px 10px; border-radius: 5px; font-size: 12px; color: #82c91e; }
    </style>
</head>
<body>
    <h1 style="color: #82c91e; margin-bottom: 30px;">BOONKER • BIO-SYSTEM</h1>
    
    <div class="nav">
        <button class="nav-btn active" onclick="show('agro', this)">🌿 AGRO-SECTOR</button>
        <button class="nav-btn" onclick="show('farm', this)">🐄 LIVESTOCK</button>
        <button class="nav-btn" onclick="show('aqua', this)">🐟 AQUA-ZONE</button>
    </div>

    <div id="agro" class="section active"></div>
    <div id="farm" class="section"></div>
    <div id="aqua" class="section"></div>

    <script>
        const data = {
            agro: [{n: 'Базилик', i: '🌿'}, {n: 'Томат', i: '🍅'}, {n: 'Роза', i: '🌹'}],
            farm: [{n: 'Корова', i: '🐄'}, {n: 'Баран', i: '🐏'}, {n: 'Гусь', i: '🦢'}, {n: 'Курица', i: '🐓'}, {n: 'Перепелка', i: '🐦'}],
            aqua: [{n: 'Карп', i: '🐟'}, {n: 'Форель', i: '🐠'}]
        };

        function show(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function render() {
            for(let id in data) {
                document.getElementById(id).innerHTML = data[id].map(item => `
                    <div class="mod-card">
                        <div class="icon">${item.i}</div>
                        <h3>${item.n}</h3>
                        <span class="badge">STATUS: MONITORING</span>
                        <button class="btn-act" onclick="alert('Подключение к камере...')">START LIVE FEED</button>
                    </div>
                `).join('');
            }
        }
        render();
    </script>
</body>
</html>
