<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boonker Bio-System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
        
        :root {
            --bg: #f8f9fa;
            --primary: #51cf66;
            --secondary: #339af0;
            --gold: #fcc419;
            --dark: #212529;
            --card-bg: #ffffff;
        }

        body {
            background: var(--bg);
            color: var(--dark);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header / Stats */
        .top-bar {
            width: 100%;
            background: var(--dark);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-around;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .stat-item { text-align: center; }
        .stat-val { font-weight: bold; color: var(--gold); font-size: 1.2em; }
        .stat-label { font-size: 0.7em; text-transform: uppercase; opacity: 0.7; }

        /* Main Grid */
        .container {
            max-width: 1000px;
            width: 100%;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Module Card */
        .module-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .module-card:hover { transform: translateY(-10px); }

        .module-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .module-icon { font-size: 3rem; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); }

        .progress-container {
            height: 12px;
            background: #e9ecef;
            border-radius: 6px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #b2f2bb);
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Buttons */
        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-collect { background: var(--primary); color: white; }
        .btn-collect:hover { background: #40c057; }
        .btn-upgrade { background: var(--secondary); color: white; }
        .btn-live { background: var(--dark); color: white; margin-top: 5px; font-size: 0.7em; }

        /* Animations */
        .float { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .lvl-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--gold);
            color: var(--dark);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="stat-item">
            <div class="stat-val" id="total-sol">500</div>
            <div class="stat-label">SOL (Balance)</div>
        </div>
        <div class="stat-item">
            <div class="stat-val" id="total-lvl">3</div>
            <div class="stat-label">System Level</div>
        </div>
    </div>

    <div class="container">
        <!-- AGRO MODULE -->
        <div class="module-card">
            <div class="lvl-badge">LVL <span id="agro-lvl">1</span></div>
            <div class="module-header">
                <div class="module-icon float">🌿</div>
                <div>
                    <h2 style="margin:0">AGRO-UNIT</h2>
                    <small>Выращивание культур</small>
                </div>
            </div>
            <div class="progress-container">
                <div id="agro-progress" class="progress-bar"></div>
            </div>
            <button class="btn-action btn-collect" onclick="collect('agro')">Собрать урожай</button>
            <button class="btn-action btn-upgrade" onclick="upgrade('agro')">Улучшить (100 SOL)</button>
            <button class="btn-action btn-live" onclick="alert('LIVE CAM: Сигнал отсутствует. Подключите реальное оборудование.')">📽 LIVE STREAM</button>
        </div>

        <!-- APIARY MODULE -->
        <div class="module-card">
            <div class="lvl-badge">LVL <span id="api-lvl">1</span></div>
            <div class="module-header">
                <div class="module-icon float" style="animation-delay: 0.5s">🐝</div>
                <div>
                    <h2 style="margin:0">APIARY</h2>
                    <small>Производство меда</small>
                </div>
            </div>
            <div class="progress-container">
                <div id="api-progress" class="progress-bar" style="background: linear-gradient(90deg, #fab005, #fff3bf)"></div>
            </div>
            <button class="btn-action btn-collect" onclick="collect('api')">Собрать мед</button>
            <button class="btn-action btn-upgrade" onclick="upgrade('api')">Улучшить (150 SOL)</button>
            <button class="btn-action btn-live" onclick="alert('LIVE CAM: Ожидание подключения улья...')">📽 LIVE STREAM</button>
        </div>

        <!-- AQUACULTURE MODULE -->
        <div class="module-card">
            <div class="lvl-badge">LVL <span id="aqua-lvl">1</span></div>
            <div class="module-header">
                <div class="module-icon float" style="animation-delay: 1s">🐟</div>
                <div>
                    <h2 style="margin:0">AQUA-SYSTEM</h2>
                    <small>Разведение рыбы</small>
                </div>
            </div>
            <div class="progress-container">
                <div id="aqua-progress" class="progress-bar" style="background: linear-gradient(90deg, #228be6, #a5d8ff)"></div>
            </div>
            <button class="btn-action btn-collect" onclick="collect('aqua')">Собрать рыбу</button>
            <button class="btn-action btn-upgrade" onclick="upgrade('aqua')">Улучшить (200 SOL)</button>
            <button class="btn-action btn-live" onclick="alert('LIVE CAM: Камера в бассейне №1...')">📽 LIVE STREAM</button>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let state = {
            sol: 500,
            modules: {
                agro: { lvl: 1, progress: 0, speed: 2, price: 50 },
                api: { lvl: 1, progress: 0, speed: 1.5, price: 80 },
                aqua: { lvl: 1, progress: 0, speed: 1, price: 120 }
            }
        };

        const sounds = {
            collect: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-positive-interface-click-1112.mp3'),
            upgrade: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3'),
            error: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3')
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function collect(id) {
            const m = state.modules[id];
            if (m.progress >= 100) {
                state.sol += m.price * m.lvl;
                m.progress = 0;
                sounds.collect.play().catch(() => {});
                showToast(`+${m.price * m.lvl} SOL собрано!`);
                render();
            } else {
                sounds.error.play().catch(() => {});
                showToast("Еще не созрело!");
            }
        }

        function upgrade(id) {
            const cost = 100 * state.modules[id].lvl;
            if (state.sol >= cost) {
                state.sol -= cost;
                state.modules[id].lvl++;
                state.modules[id].speed *= 1.2;
                sounds.upgrade.play().catch(() => {});
                showToast(`Уровень ${id} повышен!`);
                render();
            } else {
                sounds.error.play().catch(() => {});
                showToast("Недостаточно SOL!");
            }
        }

        function render() {
            document.getElementById('total-sol').innerText = Math.floor(state.sol);
            document.getElementById('total-lvl').innerText = state.modules.agro.lvl + state.modules.api.lvl + state.modules.aqua.lvl - 2;
            
            for (let id in state.modules) {
                const m = state.modules[id];
                document.getElementById(`${id}-lvl`).innerText = m.lvl;
                document.getElementById(`${id}-progress`).style.width = m.progress + '%';
            }
        }

        // Game Loop
        setInterval(() => {
            for (let id in state.modules) {
                const m = state.modules[id];
                if (m.progress < 100) {
                    m.progress += m.speed;
                    if (m.progress > 100) m.progress = 100;
                }
            }
            render();
        }, 1000);

        render();
    </script>
</body>
</html>
