<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Boonker Farm — Command Center</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .dashboard { width: 400px; padding: 30px; border: 2px solid #00ff41; border-radius: 5px; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); position: relative; z-index: 10; background: rgba(0,0,0,0.8); }
        h1 { font-size: 18px; text-align: center; margin-bottom: 30px; letter-spacing: 2px; }
        .btn { width: 100%; padding: 15px; margin: 10px 0; background: transparent; border: 1px solid #00ff41; color: #00ff41; cursor: pointer; transition: 0.3s; font-family: inherit; font-size: 14px; }
        .btn:hover { background: #00ff41; color: #000; }
        #status { text-align: center; margin-top: 20px; font-size: 12px; color: #008800; height: 20px; }
        
        /* Анимация капель */
        .drop { position: absolute; color: #3498db; font-size: 20px; pointer-events: none; opacity: 0; top: 0; }
        @keyframes fall { 0% { transform: translateY(-50px); opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>BOONKER • COMMAND CENTER</h1>
    <div id="status">STATUS: SYSTEM READY</div>
    
    <button class="btn" onclick="act('WATERING_SYSTEM', '💧')">ACTIVATE: WATERING</button>
    <button class="btn" onclick="act('GROW_LIGHTS', '💡')">ACTIVATE: LIGHTS</button>
    <button class="btn" onclick="act('VENTILATION', '💨')">ACTIVATE: VENTILATION</button>
</div>

<script>
    function act(system, icon) {
        const status = document.getElementById('status');
        status.innerText = "EXECUTING: " + system + "...";
        
        if (icon === '💧') startRain();

        setTimeout(() => {
            status.innerText = "STATUS: " + system + " ACTIVE";
            setTimeout(() => { status.innerText = "STATUS: SYSTEM READY"; }, 3000);
        }, 1500);
    }

    function startRain() {
        for(let i=0; i<20; i++) {
            const drop = document.createElement('div');
            drop.className = 'drop';
            drop.innerText = '💧';
            drop.style.left = Math.random() * 100 + 'vw';
            drop.style.animation = 'fall 1s linear forwards';
            drop.style.animationDelay = (Math.random() * 0.5) + 's';
            document.body.appendChild(drop);
            setTimeout(() => drop.remove(), 1500);
        }
    }
</script>
</body>
</html>
