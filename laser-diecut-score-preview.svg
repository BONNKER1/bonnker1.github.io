<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#f5f5f3" stroke="#cccccc" stroke-width="0.5"/>
  <!-- ===== ЧАСТЬ A: КРЫШКА ===== -->
  <rect x="10" y="60" width="50" height="430" fill="#e8e8e6" stroke="#000000" stroke-width="0.5"/>
  <text x="35" y="275" text-anchor="middle" font-size="8" fill="#555" transform="rotate(-90 35 275)">БОК. КЛАПАН</text>
  <rect x="60" y="60" width="330" height="430" fill="#ffffff" stroke="#000000" stroke-width="0.5"/>
  <text x="225" y="275" text-anchor="middle" font-size="12" fill="#555">КРЫШКА 330×430</text>
  <rect x="390" y="60" width="50" height="430" fill="#e8e8e6" stroke="#000000" stroke-width="0.5"/>
  <text x="415" y="275" text-anchor="middle" font-size="8" fill="#555" transform="rotate(-90 415 275)">БОК. КЛАПАН</text>
  <rect x="60" y="10" width="330" height="50" fill="#f0f0ee" stroke="#000000" stroke-width="0.5"/>
  <text x="225" y="38" text-anchor="middle" font-size="9" fill="#555">ПЕРЕДНИЙ КЛАПАН</text>
  <rect x="60" y="490" width="330" height="50" fill="#f0f0ee" stroke="#000000" stroke-width="0.5"/>
  <text x="225" y="518" text-anchor="middle" font-size="9" fill="#555">ЗАДНЯЯ СТЕНКА (КРЫШКА)</text>
  <!-- сгибы -->
  <g stroke="#ff0000" stroke-width="0.3" fill="none">
    <line x1="60" y1="60" x2="390" y2="60"/>
    <line x1="60" y1="490" x2="390" y2="490"/>
    <line x1="60" y1="60" x2="60" y2="490"/>
    <line x1="390" y1="60" x2="390" y2="490"/>
  </g>

  <!-- ===== ЧАСТЬ B: ДНО ===== -->
  <rect x="500" y="10" width="330" height="50" fill="#f0f0ee" stroke="#000000" stroke-width="0.5"/>
  <text x="665" y="38" text-anchor="middle" font-size="9" fill="#555">ЗАДНЯЯ СТЕНКА (ДНО)</text>
  <rect x="450" y="60" width="50" height="430" fill="#e8e8e6" stroke="#000000" stroke-width="0.5"/>
  <text x="475" y="275" text-anchor="middle" font-size="8" fill="#555" transform="rotate(-90 475 275)">БОК. СТЕНКА</text>
  <rect x="500" y="60" width="330" height="430" fill="#ffffff" stroke="#000000" stroke-width="0.5"/>
  <text x="665" y="275" text-anchor="middle" font-size="12" fill="#555">ДНО 330×430</text>
  <rect x="830" y="60" width="50" height="430" fill="#e8e8e6" stroke="#000000" stroke-width="0.5"/>
  <text x="855" y="275" text-anchor="middle" font-size="8" fill="#555" transform="rotate(-90 855 275)">БОК. СТЕНКА</text>
  <rect x="500" y="490" width="330" height="50" fill="#f0f0ee" stroke="#000000" stroke-width="0.5"/>
  <text x="665" y="518" text-anchor="middle" font-size="9" fill="#555">ПЕРЕДНЯЯ СТЕНКА</text>
  <g stroke="#ff0000" stroke-width="0.3" fill="none">
    <line x1="500" y1="60" x2="830" y2="60"/>
    <line x1="500" y1="490" x2="830" y2="490"/>
    <line x1="500" y1="60" x2="500" y2="490"/>
    <line x1="830" y1="60" x2="830" y2="490"/>
  </g>

  <text x="450" y="585" text-anchor="middle" font-size="10" fill="#333">Цельная развёртка · лист 900×600 мм · ЧЁРНЫЙ = рез, КРАСНЫЙ = микро-надрез (биговка)</text>
</svg>